<title>The Wakelins</title>

<style>
  :root {
    --bg: #faf9f7;
    --fg: #1c1c1c;
    --line: #d9d5ce;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --fg: #f0eee9;
      --line: #333;
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    -webkit-font-smoothing: antialiased;
  }
  main { text-align: center; }
  img {
    display: block;
    width: auto;
    height: auto;
    max-width: min(300px, 70vw);
    max-height: 48vh;
    margin: 0 auto 36px;
  }
  h1 {
    font-weight: 400;
    font-size: clamp(2.4rem, 8vw, 4rem);
    letter-spacing: 0.02em;
    margin: 0 0 28px;
  }
  .rule {
    width: 48px;
    height: 1px;
    background: var(--line);
    margin: 0 auto;
  }
</style>
